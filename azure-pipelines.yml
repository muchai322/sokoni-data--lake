trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  terraformVersion: "1.9.8"

stages:
  - stage: Validate
    displayName: Format, validate, and test
    jobs:
      - job: TerraformChecks
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: $(terraformVersion)
          - script: |
              set -euo pipefail
              terraform fmt -check -recursive infra
              terraform -chdir=infra/environments/dev init -backend=false -input=false
              terraform -chdir=infra/environments/dev validate
              terraform -chdir=tests init -backend=false -input=false
              terraform -chdir=tests test
              terraform -chdir=infra/environments/prod init -backend=false -input=false
              terraform -chdir=infra/environments/prod validate
              terraform -chdir=infra/bootstrap init -backend=false -input=false
              terraform -chdir=infra/bootstrap validate
            displayName: Terraform checks

  - stage: DeployDev
    displayName: Plan and apply dev
    dependsOn: Validate
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: Dev
        environment: dev
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: TerraformInstaller@1
                  inputs:
                    terraformVersion: $(terraformVersion)
                - task: AzureCLI@2
                  displayName: Plan and apply dev
                  inputs:
                    azureSubscription: $(AZURE_SERVICE_CONNECTION)
                    scriptType: bash
                    scriptLocation: scriptPath
                    scriptPath: pipelines/infra.yml
                    addSpnToEnvironment: true
                  env:
                    ENVIRONMENT: dev
                    AZURE_SUBSCRIPTION_ID: $(AZURE_SUBSCRIPTION_ID)
                    TFSTATE_STORAGE_ACCOUNT_NAME: $(TFSTATE_STORAGE_ACCOUNT_NAME)
                    TF_IN_AUTOMATION: "true"
                    TF_INPUT: "false"
                    TF_VAR_subscription_id: $(AZURE_SUBSCRIPTION_ID)

  - stage: DeployProd
    displayName: Plan and apply prod
    dependsOn: DeployDev
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: Prod
        environment: prod
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: TerraformInstaller@1
                  inputs:
                    terraformVersion: $(terraformVersion)
                - task: AzureCLI@2
                  displayName: Plan and apply prod
                  inputs:
                    azureSubscription: $(AZURE_SERVICE_CONNECTION)
                    scriptType: bash
                    scriptLocation: scriptPath
                    scriptPath: pipelines/infra.yml
                    addSpnToEnvironment: true
                  env:
                    ENVIRONMENT: prod
                    AZURE_SUBSCRIPTION_ID: $(AZURE_SUBSCRIPTION_ID)
                    TFSTATE_STORAGE_ACCOUNT_NAME: $(TFSTATE_STORAGE_ACCOUNT_NAME)
                    TF_IN_AUTOMATION: "true"
                    TF_INPUT: "false"
                    TF_VAR_subscription_id: $(AZURE_SUBSCRIPTION_ID)
